<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="ShelfSense thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A33"/>
      <stop offset="1" stop-color="#14423F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5B342" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F5B342" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle street-map grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 120H1200M0 260H1200M0 400H1200M0 540H1200"/>
    <path d="M140 0V630M360 0V630M580 0V630M800 0V630M1020 0V630"/>
  </g>

  <!-- taste-signal ripples around the shop -->
  <g transform="translate(850 300)">
    <circle r="250" fill="url(#glow)"/>
    <circle r="230" fill="none" stroke="#F5B342" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="4 10"/>
    <circle r="170" fill="none" stroke="#F5B342" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 10"/>
    <circle r="110" fill="none" stroke="#F5B342" stroke-opacity="0.45" stroke-width="2"/>

    <!-- shelf unit -->
    <g>
      <rect x="-120" y="-120" width="240" height="240" rx="14" fill="#0A1E25" stroke="#F4EFE6" stroke-opacity="0.9" stroke-width="5"/>
      <path d="M-120 -40H120M-120 40H120" stroke="#F4EFE6" stroke-width="5"/>
      <!-- top shelf: stocked evenly -->
      <rect x="-100" y="-98" width="34" height="48" rx="5" fill="#6FA8A0"/>
      <rect x="-58" y="-88" width="34" height="38" rx="5" fill="#6FA8A0"/>
      <rect x="-16" y="-104" width="34" height="54" rx="5" fill="#6FA8A0"/>
      <rect x="26" y="-92" width="34" height="42" rx="5" fill="#6FA8A0"/>
      <rect x="68" y="-100" width="34" height="50" rx="5" fill="#6FA8A0"/>
      <!-- middle shelf: one gap highlighted -->
      <rect x="-100" y="-18" width="34" height="48" rx="5" fill="#6FA8A0"/>
      <rect x="-58" y="-10" width="34" height="40" rx="5" fill="#6FA8A0"/>
      <rect x="-16" y="-16" width="34" height="46" rx="5" fill="none" stroke="#F5B342" stroke-width="4" stroke-dasharray="7 6"/>
      <rect x="26" y="-8" width="34" height="38" rx="5" fill="#6FA8A0"/>
      <rect x="68" y="-18" width="34" height="48" rx="5" fill="#6FA8A0"/>
      <!-- bottom shelf: new recommended items in amber -->
      <rect x="-100" y="62" width="34" height="46" rx="5" fill="#6FA8A0"/>
      <rect x="-58" y="54" width="34" height="54" rx="5" fill="#F5B342"/>
      <rect x="-16" y="66" width="34" height="42" rx="5" fill="#6FA8A0"/>
      <rect x="26" y="58" width="34" height="50" rx="5" fill="#F5B342"/>
      <rect x="68" y="64" width="34" height="44" rx="5" fill="#6FA8A0"/>
    </g>

    <!-- location pin -->
    <g transform="translate(120 -128)">
      <path d="M0 40C-26 6 -34 -6 -34 -22A34 34 0 0 1 34 -22C34 -6 26 6 0 40Z" fill="#F5B342" stroke="#0E2A33" stroke-width="5"/>
      <circle cy="-22" r="12" fill="#0E2A33"/>
    </g>
  </g>

  <!-- wordmark and copy -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="80" y="268" font-size="92" font-weight="700" fill="#F4EFE6">Shelf<tspan fill="#F5B342">Sense</tspan></text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="84" y="330" font-size="34" fill="#F4EFE6" fill-opacity="0.92">Stock what your neighborhood wants.</text>
    <text x="84" y="378" font-size="24" fill="#F4EFE6" fill-opacity="0.65">Location-aware taste insight for independent shops</text>

    <rect x="84" y="430" width="270" height="46" rx="23" fill="none" stroke="#F5B342" stroke-width="2.5"/>
    <text x="219" y="461" font-size="21" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#F5B342">POWERED BY QLOO</text>
  </g>
</svg>
